version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rapipedido_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rapipedido
      POSTGRES_USER: rapipedido
      POSTGRES_PASSWORD: rapipedido_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapipedido"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rapipedido_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
